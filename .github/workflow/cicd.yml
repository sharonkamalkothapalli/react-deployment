name: CICD

on:
  push:
    branchs:
      - deploy-to-ec2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker login -u ${{ secrets.DOKER_USERNAME }} -p ${{secrets.DOCKER_PASSWORD}}
