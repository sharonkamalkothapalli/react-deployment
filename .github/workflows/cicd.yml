name: CICD

on:
  push:
    branchs:
      - deploy-to-ec2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOKER_USERNAME }} -p ${{secrets.DOCKER_PASSWORD}}
      - name: Build Docker Image
        run: docker build -t sharonkamalk/reactcashmonkey .
      - name: Publish image to docker Hub
        run: docker push sharonkamalk/reactcashmonkey:latest

  deploy:
    needs: build
    runs-on: aws-ec2
    steps:
      - name: Pull image from docker Hub
        run: docker pull sharonkamalk/reactcashmonkey:latest
      - name: Delete old container
        run: docker rm -f reactConatiner
      - name: Run docker container
        run: docker run -d -p 3000:80 --name reactContainer sharonkamalk/reactcashmonkey
